# Kitty terminal configuration
# Standalone CachyOS Hyprland - Everforest (Calm green earthy dark theme)

# Fonts
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Cursor
cursor            block
cursor_blink_interval 0.5

# Cursor trail
cursor_trail 3
cursor_trail_decay_start 0.1
cursor_trail_decay_end 0.4
cursor_trail_duration 0.4
cursor_trail_start_threshold 0

# Window
background_opacity 0.93
window_padding_width 8 8 8 8
window_margin_width  6 6 6 6
hide_window_decorations titlebar-only
placement_strategy center
remember_window_size no
initial_window_width  900
initial_window_height 560

# Tab bar (powerline slanted)
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_margin_width 4.0
tab_bar_min_tabs 1
active_tab_foreground   #2D353B
active_tab_background   #A7C080
active_tab_font_style   bold
inactive_tab_foreground #D3C6AA
inactive_tab_background #343F44
inactive_tab_font_style normal

# Remote control (for kitty @ to change theme, etc)
allow_remote_control socket
listen_on unix:/tmp/kitty.sock

# Performance
repaint_delay   6
input_delay     1
sync_to_monitor no

# Behavior
bell_on_tab     no
bell_on_vis     no
enable_audio_bell no
mouse_hide_wait 3.0
url_color       #7FBBB3
url_style       curly

# Scrollback
scrollback_lines 10000
scrollback_pager_history_size 0

# Colors (Everforest)
background #2D353B
foreground #D3C6AA
selection_background #4A575D
selection_foreground #D3C6AA

cursor            #D3C6AA
cursor_text_color #2D353B

color0  #4B565C
color1  #E67E80
color2  #A7C080
color3  #DBBC7F
color4  #7FBBB3
color5  #D699B6
color6  #83C092
color7  #9DA9A0
color8  #859289
color9  #E67E80
color10 #A7C080
color11 #DBBC7F
color12 #7FBBB3
color13 #D699B6
color14 #83C092
color15 #D3C6AA
